<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Trip Manager by TonSkywalker — วางแผนทริป • แบ่งจ่าย • เคลียร์บิล</title>
  <meta name="description" content="Trip Manager by TonSkywalker —แอปวางแผนทริปแบบกลุ่ม แบ่งค่าใช้จ่าย เคลียร์บิล แผนการเดินทางและแผนที่ (จัดทำโดย TonSkywalker — ห้ามเผยแพร่เชิงพาณิชย์)">
  <meta name="application-name" content="Trip Manager">
  <meta name="author" content="TonSkywalker">
  <meta name="copyright" content="© 2024–2026 TonSkywalker. All rights reserved.">
  <meta name="theme-color" id="meta-theme-color" content="#1f6bfb">
  <!-- Build identity — source of truth: src/js/utils/buildInfo.js (a unit test keeps these in sync) -->
  <meta name="app-version" content="23">
  <meta name="app-palette" content="Sky light">
  <meta name="app-updated" content="2026-10-07">
  <meta property="og:title" content="Trip Manager by TonSkywalker">
  <meta property="og:description" content="วางแผนทริป • แบ่งค่าใช้จ่าย • เคลียร์บิล ครบในแอปเดียว โดย TonSkywalker">
  <!-- Logo ในแถบบราวเซอร์ (favicon) — ไฟล์จริงในโฟลเดอร์ public/ และแบบ inline ที่ตามธีมสี -->
  <link rel="icon" id="favicon-tint" type="image/svg+xml" href="./public/favicon.svg">
  <link rel="shortcut icon" href="./public/favicon.svg">
  <link rel="apple-touch-icon" href="./public/apple-touch-icon.png">
  <link rel="mask-icon" href="./public/favicon.svg" color="#1f6bfb">
  <!-- No PWA -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: { extend: { fontFamily: { display: ['Outfit','Plus Jakarta Sans','Noto Sans Thai','sans-serif'], sans: ['Plus Jakarta Sans','Noto Sans Thai','sans-serif'] } } }
    }
  </script>

  <!-- Design System v21 “Vivid & Deep” (cache-busted) -->
  <link rel="stylesheet" href="./src/css/tokens.css?v=23">
  <link rel="stylesheet" href="./src/css/components.css?v=23">
  <link rel="stylesheet" href="./src/css/refresh.css?v=23">
  <link rel="stylesheet" href="./src/css/animations.css?v=23">

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <!-- Import Map -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js"
    }
  }
  </script>

  <style>
    body {
      padding-bottom: calc(var(--bottom-nav-h) + 28px + env(safe-area-inset-bottom));
      background: var(--bg);
      transition: background 0.4s ease;
    }
    @media (min-width: 768px) {
      body { padding-bottom: 0; }
      .bottom-nav { display: none !important; }
    }
    .desktop-nav { display: none; }
    @media (min-width: 768px) {
      .desktop-nav {
        display: flex;
        position: sticky;
        top: var(--header-h);
        z-index: 25;
        background: color-mix(in srgb, var(--surface) 86%, transparent);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border-bottom: 1px solid var(--border-light);
        padding-top: 10px;
        padding-bottom: 10px;
        margin-bottom: 6px;
      }
    }

    /* Glass header */
    #app-header {
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border-bottom: 1px solid var(--border-light);
      box-shadow: none;
      transition: background 0.4s ease, border-color 0.4s ease;
    }
    /* Page transition base */
    #app { transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

    /* Ambient animated background blobs (theme-tinted, no emoji, no images) */
    #bg-decor { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    #bg-decor .blob { position: absolute; border-radius: 9999px; filter: blur(74px); opacity: 0.55; will-change: transform; }
    #bg-decor .blob-1 { width: 44vmax; height: 44vmax; top: -15vmax; left: -11vmax; background: radial-gradient(circle, color-mix(in srgb, var(--grad-1) 24%, transparent), transparent 66%); animation: blobDrift1 26s ease-in-out infinite; }
    #bg-decor .blob-2 { width: 38vmax; height: 38vmax; bottom: -13vmax; right: -9vmax; background: radial-gradient(circle, color-mix(in srgb, var(--brand-mist-raw) 38%, transparent), transparent 66%); animation: blobDrift2 32s ease-in-out infinite; }
    #bg-decor .blob-3 { width: 26vmax; height: 26vmax; top: 36%; left: 56%; background: radial-gradient(circle, color-mix(in srgb, var(--brand-yellow-raw) 20%, transparent), transparent 66%); animation: blobDrift3 22s ease-in-out infinite; }
    [data-theme="dark"] #bg-decor .blob { opacity: 0.34; }

    /* Logo link */
    #logo-link { text-decoration: none; color: inherit; border-radius: var(--radius-full); transition: transform 0.2s ease; }
    #logo-link:hover { transform: translateY(-1px) scale(1.02); }
    #logo-link:active { transform: scale(0.97); }
    .logo-badge { transition: box-shadow 0.3s ease; }
    #logo-link:hover .logo-badge { box-shadow: var(--shadow-primary); }
    /* “by TonSkywalker” — deliberately small next to the product name */
    .app-by {
      font-size: 9.5px; font-weight: 700; letter-spacing: .02em; opacity: .72;
      margin-left: 6px; white-space: nowrap; color: var(--text-secondary);
    }
    @media (min-width: 768px) { .app-by { font-size: 10px; } }
    /* profile picture = settings (a small gear badge hints at it) */
    #user-avatar-btn.has-settings { position: relative; }
    .avatar-gear {
      position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px;
      border-radius: 9999px; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-xs); color: var(--primary-strong);
    }
    .avatar-gear i, .avatar-gear svg { width: 11px; height: 11px; }
  </style>
</head>
<body class="min-h-screen bg-[var(--bg)] text-[var(--text)]">
  <!-- Ambient background -->
  <div id="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <!-- Header -->
  <header id="app-header" class="sticky top-0 z-30" style="height: var(--header-h);">
    <div class="max-w-[1280px] mx-auto px-4 h-full flex items-center justify-between gap-3">
      <!-- Logo = home (trip list) -->
      <a href="#/trips" id="logo-link" class="flex items-center gap-3 group" title="หน้าแรก — รายการทริป" aria-label="Trip Manager — หน้าแรก">
        <span class="logo-badge w-10 h-10 rounded-full grid place-items-center shadow-sm animate-float" style="background: var(--gradient-primary); border: 2px solid rgba(255,255,255,0.9);">
          <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true">
            <circle cx="72" cy="28" r="15" fill="var(--brand-yellow-raw)"/>
            <path d="M4 82 L46 18 L88 82 Z" fill="rgba(255,255,255,0.96)"/>
            <path d="M34 36 L46 18 L58 36 L52 41 L46 34 L40 41 Z" fill="color-mix(in srgb, var(--primary-raw) 32%, transparent)"/>
            <path d="M34 36 L46 18 L58 36 L52 41 L46 34 L40 41 Z" fill="none" stroke="color-mix(in srgb, var(--primary-raw) 60%, transparent)" stroke-width="2.4"/>
            <rect x="4" y="84" width="92" height="6" rx="3" fill="var(--brand-yellow-raw)"/>
          </svg>
        </span>
        <span class="min-w-0">
          <span class="block leading-none tracking-tight" style="font-family: var(--font-display);">
            <span class="font-bold text-[16px]">Trip&nbsp;Manager</span>
            <span class="app-by" title="จัดทำโดย TonSkywalker">by TonSkywalker</span>
          </span>
          <span id="header-subtitle" class="block text-[11px] text-[var(--text-tertiary)] mt-0.5 font-medium">plan • split • settle • travel</span>
        </span>
      </a>

      <div class="flex items-center gap-3">
        <div id="sync-status" class="hidden md:flex items-center gap-2 text-[11px] px-3 py-1.5 rounded-full border font-medium" style="background:var(--surface); border-color:var(--border); box-shadow: var(--shadow-xs);">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span>Online</span>
        </div>
        <div id="live-clocks" class="hidden lg:flex items-center gap-2 text-[11px] font-medium mr-1">
          <span id="clock-bkk" class="px-2.5 py-1 rounded-full bg-[var(--bg-secondary)]">BKK --:--</span>
          <span id="clock-tokyo" class="px-2.5 py-1 rounded-full bg-[var(--bg-secondary)]">TYO --:--</span>
        </div>
        <!-- Theme, Lang, Mode controls injected by app.js -->
        <button id="refresh-btn" class="btn btn-ghost btn-icon btn-press" aria-label="Refresh"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
        <div id="user-menu" class="relative ml-1">
          <!-- v18: the profile picture is the single entry point for Settings -->
          <button id="user-avatar-btn" class="avatar w-10 h-10 text-[13px] btn-press has-settings" style="background: var(--gradient-primary);" title="ตั้งค่า — Settings" aria-label="ตั้งค่า application">
            ?<span class="avatar-gear" aria-hidden="true"><i data-lucide="settings"></i></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Member (username + PIN) session notice: shown when the Cloud Functions are
       not deployed, so data comes from Firestore/cache instead of a custom token. -->
  <div id="member-session-notice" hidden class="max-w-[1280px] mx-auto px-4 pt-3">
    <div class="flex items-start gap-2 text-[12px] rounded-xl px-3 py-2 border" style="background:var(--bg-secondary); border-color:var(--border); color:var(--text-secondary);">
      <i data-lucide="wifi-off" class="w-4 h-4 mt-0.5 shrink-0"></i>
      <span id="member-session-notice-text"></span>
      <button id="member-session-notice-close" class="ml-auto btn btn-ghost btn-icon shrink-0" aria-label="ปิด"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
    </div>
  </div>

  <!-- Offline (Firestore cache) indicator — v17 -->
  <div id="offline-strip-wrap" class="max-w-[1280px] mx-auto px-4 pt-3" hidden></div>

  <!-- Desktop Nav -->
  <nav class="desktop-nav max-w-[1280px] mx-auto px-4 py-4 gap-2 flex-wrap" id="desktop-nav"></nav>

  <!-- Main -->
  <main id="app" class="max-w-[1280px] mx-auto px-4 py-6 min-h-[calc(100vh_-_var(--header-h)_-_var(--bottom-nav-h))] md:min-h-[calc(100vh_-_var(--header-h)_-_60px)]">
    <div id="loading-screen" class="grid place-items-center py-24">
      <div class="text-center page-enter">
        <div id="fuji-loader" class="animate-float"></div>
        <p class="mt-6 text-sm font-medium text-[var(--text-secondary)]">
          กำลังโหลด
          <span class="loading-dot inline-block">.</span><span class="loading-dot inline-block" style="animation-delay:.15s">.</span><span class="loading-dot inline-block" style="animation-delay:.3s">.</span>
        </p>
        <div class="mt-4 flex justify-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[var(--primary)] animate-bounce" style="animation-delay: 0s;"></span>
          <span class="w-2 h-2 rounded-full bg-[var(--primary)] animate-bounce" style="animation-delay: 0.15s;"></span>
          <span class="w-2 h-2 rounded-full bg-[var(--primary)] animate-bounce" style="animation-delay: 0.3s;"></span>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Nav (mobile): Home removed — tap the logo to go home.
       Documents moved out (still reachable via the เพิ่มเติม page / desktop nav);
       Dashboard + เคลียร์บิล added for one-tap access. -->
  <nav id="bottom-nav" class="bottom-nav md:hidden">
    <button data-route="#/trip/dashboard" class="bottom-nav-item"><i data-lucide="layout-dashboard"></i><span>แดชบอร์ด</span></button>
    <button data-route="#/trip/itinerary" class="bottom-nav-item"><i data-lucide="map-pinned"></i><span>แผน</span></button>
    <button data-route="#/trip/expenses" class="bottom-nav-item"><i data-lucide="wallet"></i><span>ค่าใช้จ่าย</span></button>
    <button data-route="#/trip/settlement" class="bottom-nav-item"><i data-lucide="hand-coins"></i><span>เคลียร์บิล</span></button>
    <button data-route="#/trip/more" class="bottom-nav-item"><i data-lucide="more-horizontal"></i><span>เพิ่มเติม</span></button>
  </nav>

  <!-- Global footer — brand lock-up + build identity (always visible).
       Values are painted from src/js/utils/buildInfo.js on boot (paintAppFooter). -->
  <footer id="app-footer" class="app-footer">
    <div class="app-footer-inner">
      <div class="app-footer-brand-row">
        <span class="app-footer-mark" aria-hidden="true"><i data-lucide="plane-takeoff"></i></span>
        <span class="app-footer-wordmark">Trip Manager</span>
        <span class="app-footer-by">by TonSkywalker</span>
      </div>
      <div class="app-footer-chips">
        <span class="app-footer-chip app-footer-chip--version" data-footer-version>v21</span>
        <span class="app-footer-chip" data-footer-updated>อัปเดตล่าสุด 6 ต.ค. 2569</span>
        <span class="app-footer-chip" data-footer-palette>ชุดสี Sky light</span>
        <span class="app-footer-chip app-footer-chip--build" data-build-stamp></span>
      </div>
    </div>
    <p class="app-footer-legal">
      <!-- full © line, painted from buildInfo.js on boot / language change -->
      <span class="app-footer-sep" aria-hidden="true"></span>
      <span data-footer-copyright>© 2024–2026 TonSkywalker — สงวนลิขสิทธิ์ ห้ามทำซ้ำ เผยแพร่ ดัดแปลง หรือใช้เชิงพาณิชย์ก่อนได้รับอนุญาตเป็นลายลักษณ์อักษร</span>
    </p>
  </footer>

  <!-- FAB -->
  <button id="fab" class="fab hidden btn-press" aria-label="Add"><i data-lucide="plus" class="w-6 h-6"></i></button>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Firebase config bootstrap -->
  <script>
    try {
      const saved = localStorage.getItem('fuji_firebase_config');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.apiKey && parsed.projectId) {
          window.__FIREBASE_CONFIG__ = parsed;
          console.log('[Config] Loaded from localStorage');
        }
      }
      const urlParams = new URLSearchParams(location.search);
      const cfgParam = urlParams.get('cfg');
      if (cfgParam) {
        try {
          const decoded = JSON.parse(atob(cfgParam));
          window.__FIREBASE_CONFIG__ = decoded;
          localStorage.setItem('fuji_firebase_config', JSON.stringify(decoded));
          console.log('[Config] Loaded from URL param');
        } catch (e) { console.warn('Invalid cfg param', e); }
      }
    } catch (e) { console.warn('Config load failed', e); }
  </script>

  <!-- App (cache-busted) -->
  <script type="module" src="./src/js/app.js?v=23"></script>
</body>
</html>
