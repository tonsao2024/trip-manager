<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fuji Trip Planner & Expense Manager</title>
  <meta name="description" content="Modern trip planner with group expense splitting, smart scheduling, and settlement">
  <meta name="theme-color" content="#6366f1">
  <!-- No PWA manifest - per requirements -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: { extend: {} }
    }
  </script>

  <!-- Design Tokens -->
  <link rel="stylesheet" href="./src/css/tokens.css">
  <link rel="stylesheet" href="./src/css/components.css">
  <link rel="stylesheet" href="./src/css/animations.css">

  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <!-- Import Map for Firebase -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js"
    }
  }
  </script>

  <style>
    body { padding-bottom: var(--bottom-nav-h); }
    @media (min-width: 768px) { body { padding-bottom: 0; } .bottom-nav { display: none !important; } }
    .desktop-nav { display: none; }
    @media (min-width: 768px) { .desktop-nav { display: flex; } }
  </style>
</head>
<body class="min-h-screen bg-[var(--bg)] text-[var(--text)]">
  <!-- Header -->
  <header id="app-header" class="sticky top-0 z-30 backdrop-blur-xl border-b" style="background: color-mix(in srgb, var(--surface) 80%, transparent); border-color: var(--border); height: var(--header-h);">
    <div class="max-w-[1280px] mx-auto px-4 h-full flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl grid place-items-center" style="background: var(--gradient-fuji); color:white; font-weight:800;">F</div>
        <div>
          <div class="font-bold text-[15px] leading-none">Fuji Planner</div>
          <div id="header-subtitle" class="text-[11px] text-[var(--text-tertiary)] mt-0.5">Group Expense Manager</div>
        </div>
        <div id="sync-status" class="hidden md:flex items-center gap-2 ml-4 text-[11px] px-2.5 py-1 rounded-full border" style="background:var(--bg-secondary); border-color:var(--border);">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>Online</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div id="live-clocks" class="hidden lg:flex items-center gap-3 text-[11px] font-medium">
          <span id="clock-bkk">BKK --:--</span>
          <span id="clock-tokyo">TYO --:--</span>
        </div>
        <button id="theme-toggle" class="btn btn-ghost btn-icon" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
        <button id="refresh-btn" class="btn btn-ghost btn-icon" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button>
        <div id="user-menu" class="relative">
          <button id="user-avatar-btn" class="avatar w-9 h-9 text-[13px]" style="background: var(--gradient-fuji);">?</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Desktop Nav -->
  <nav class="desktop-nav max-w-[1280px] mx-auto px-4 py-3 gap-2 flex-wrap" id="desktop-nav">
    <!-- Filled by JS -->
  </nav>

  <!-- Main -->
  <main id="app" class="max-w-[1280px] mx-auto px-4 py-6 min-h-[calc(100vh-var(--header-h)-var(--bottom-nav-h))] md:min-h-[calc(100vh-var(--header-h)-60px)]">
    <div id="loading-screen" class="grid place-items-center py-20">
      <div class="text-center">
        <div id="fuji-loader"></div>
        <p class="mt-4 text-sm text-[var(--text-secondary)]">กำลังโหลด...</p>
      </div>
    </div>
  </main>

  <!-- Bottom Nav (Mobile) -->
  <nav id="bottom-nav" class="bottom-nav md:hidden">
    <button data-route="#/trip/dashboard" class="bottom-nav-item"><i data-lucide="layout-dashboard"></i><span>Home</span></button>
    <button data-route="#/trip/itinerary" class="bottom-nav-item"><i data-lucide="map-pinned"></i><span>Plan</span></button>
    <button data-route="#/trip/expenses" class="bottom-nav-item"><i data-lucide="wallet"></i><span>Expenses</span></button>
    <button data-route="#/trip/settlement" class="bottom-nav-item"><i data-lucide="hand-coins"></i><span>Settle</span></button>
    <button data-route="#/trip/more" class="bottom-nav-item"><i data-lucide="more-horizontal"></i><span>More</span></button>
  </nav>

  <!-- FAB -->
  <button id="fab" class="fab hidden" aria-label="Add"><i data-lucide="plus" class="w-6 h-6"></i></button>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Firebase config override for GitHub Pages (user fills) -->
  <script>
    // Users can set window.__FIREBASE_CONFIG__ before app.js loads via localStorage or inline
    try {
      const saved = localStorage.getItem('fuji_firebase_config');
      if (saved) window.__FIREBASE_CONFIG__ = JSON.parse(saved);
    } catch {}
  </script>

  <!-- App Entry -->
  <script type="module" src="./src/js/app.js"></script>

  <script>
    // Theme handling
    (function(){
      const saved = localStorage.getItem('fuji_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      window.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.addEventListener('click', () => {
          const cur = document.documentElement.getAttribute('data-theme');
          const next = cur === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('fuji_theme', next);
        });
      });
    })();
  </script>
</body>
</html>
