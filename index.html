<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Trip Manager by TonSkywalker — วางแผนทริป • แบ่งจ่าย • เคลียร์บิล</title>
  <meta name="description" content="Trip Manager by TonSkywalker —แอปวางแผนทริปแบบกลุ่ม แบ่งค่าใช้จ่าย เคลียร์บิล แผนการเดินทางและแผนที่ (จัดทำโดย TonSkywalker — ห้ามเผยแพร่เชิงพาณิชย์)">
  <meta name="application-name" content="Trip Manager">
  <meta name="author" content="TonSkywalker">
  <meta name="copyright" content="© 2024–2026 TonSkywalker. All rights reserved.">
  <meta name="theme-color" id="meta-theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" id="meta-apple-status-bar-style" content="default">
  <!-- Set iOS status-bar contrast before first paint when a dark mode is saved. -->
  <script>
    try {
      const savedMode = localStorage.getItem('fuji_theme');
      const darkMode = savedMode === 'dark' || (savedMode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (darkMode) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('meta-theme-color').setAttribute('content', '#0e0e10');
        document.getElementById('meta-apple-status-bar-style').setAttribute('content', 'black-translucent');
      }
    } catch {}
  </script>
  <!-- v34 Flat design preferences (radius / density / depth). Applied before the
       first paint so a chosen style never flashes the default one. -->
  <script>
    try {
      const ui = JSON.parse(localStorage.getItem('fuji_ui_style') || '{}');
      const root = document.documentElement;
      const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
      root.dataset.radius = pick(ui.radius, ['sharp', 'soft', 'round'], 'soft');
      root.dataset.density = pick(ui.density, ['compact', 'regular', 'roomy'], 'regular');
      root.dataset.depth = pick(ui.depth, ['flat', 'soft'], 'flat');
    } catch (e) { /* private mode — keep the defaults */ }
  </script>
  <!-- Build identity — source of truth: src/js/utils/buildInfo.js (a unit test keeps these in sync) -->
  <meta name="app-version" content="37">
  <meta name="app-palette" content="Sky light">
  <meta name="app-updated" content="2026-11-10">
  <meta property="og:title" content="Trip Manager by TonSkywalker">
  <meta property="og:description" content="วางแผนทริป • แบ่งค่าใช้จ่าย • เคลียร์บิล ครบในแอปเดียว โดย TonSkywalker">
  <!-- Logo ในแถบบราวเซอร์ (favicon) — ไฟล์จริงในโฟลเดอร์ public/ และแบบ inline ที่ตามธีมสี -->
  <link rel="icon" id="favicon-tint" type="image/svg+xml" href="./public/favicon.svg">
  <link rel="shortcut icon" href="./public/favicon.svg">
  <link rel="apple-touch-icon" href="./public/apple-touch-icon.png">
  <link rel="mask-icon" href="./public/favicon.svg" color="#1f6bfb">
  <!-- Web Push (v30): a service worker + FCM, but still no offline cache.
       firebase-messaging-sw.js must stay in the root so it can control the app. -->
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Web fonts (v35): ONE family — IBM Plex Sans Thai draws Thai and Latin
       together (400 / 500 / 600). IBM Plex Mono is only for codes and the
       settlement receipt. Loaded non-blocking with display=swap; noscript keeps
       it working without JS. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>

  <!-- Design System v35 “Calm” (cache-busted) — tokens.css explains the rules -->
  <link rel="stylesheet" href="./src/css/tokens.css?v=37">
  <link rel="stylesheet" href="./src/css/components.css?v=37&amp;rev=countdown4">
  <link rel="stylesheet" href="./src/css/refresh.css?v=37">
  <link rel="stylesheet" href="./src/css/animations.css?v=37">
  <!-- FLAT DESIGN LAYER (v34 → v35 calm pass) — every surface, button, card and
       menu is shaped here. It loads after the legacy sheets and before the
       compiled Tailwind utilities; Settings → Appearance can re-scale radius /
       density / depth live. -->
  <link rel="stylesheet" href="./src/css/flat.css?v=37">
  <!-- Tailwind: precompiled static utilities (tools/build-assets.mjs).
       Replaces the Play CDN runtime compiler. Loaded AFTER the app stylesheets
       to keep the same cascade order the CDN's injected <style> used to have. -->
  <link rel="stylesheet" href="./src/css/tailwind.css?v=35">
  <link rel="stylesheet" href="./src/css/dimension.css?v=13">

  <!-- Lucide icons: local subset (272 icons) instead of the full ~1500-icon CDN
       bundle. Deferred so it never blocks first paint; runs before app.js. -->
  <script src="./src/js/vendor/lucide.js?v=35" defer></script>

  <!-- Import Map -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js",
      "firebase/functions": "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js"
    }
  }
  </script>

  <style>
    body {
      padding-bottom: calc(var(--bottom-nav-h) + 28px + env(safe-area-inset-bottom));
      background: var(--bg);
    }
    @media (min-width: 768px) {
      body { padding-bottom: 0; }
      .bottom-nav { display: none !important; }
    }
    /* Desktop menu v29 — its OWN row inside the sticky header, so on computers
       EVERY menu is visible at once: no icon-only collapse, no overlap and no
       half-hidden horizontal scroll (owner request, 11 Oct 2026).
       Row 1 = brand + account controls, row 2 = the full menu (+ clock/sync). */
    .desktop-nav { display: none; }
    .header-nav-row { display: none; }
    #app-header { height: var(--header-h); }
    .header-row { height: var(--header-h); }
    @media (min-width: 768px) {
      /* 56px brand row + 44px menu row + 1px border = 101px sticky header. */
      :root { --header-h: 101px; }
      #app-header { height: auto; }
      .header-row { height: 56px; }
      .header-nav-row {
        display: flex; align-items: center; gap: 8px;
        height: 44px; padding-bottom: 8px;
      }
      .desktop-nav {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 1 1 auto;
        min-width: 0;
        justify-content: flex-start;
        overflow-x: auto;   /* emergency valve only — the sizes below fit all 8 */
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .desktop-nav::-webkit-scrollbar { display: none; }
      .desktop-nav .menu-item {
        flex: 0 0 auto;
        padding: 4px 8px;
        font-size: 13px;
        gap: 8px;
        white-space: nowrap;
        min-height: 34px;
      }
      .header-nav-side {
        margin-left: auto; flex: 0 0 auto;
        display: flex; align-items: center; gap: 8px;
      }
    }
    /* Roomy screens get the full-size chips back. */
    @media (min-width: 1280px) {
      .desktop-nav { gap: 8px; }
      .desktop-nav .menu-item { padding: 4px 12px; font-size: 14px; gap: 8px; min-height: 36px; }
    }
    /* Compact laptops (768–1279) swap to SHORT labels — still words, never
       icon-only — so all eight menus stay readable on one line. */
    .menu-item-label-short { display: none; }
    @media (min-width: 768px) and (max-width: 1279.9px) {
      .desktop-nav .menu-item .menu-item-label { display: none; }
      .desktop-nav .menu-item .menu-item-label-short { display: inline; }
    }
    /* The brand subtitle folds away once the menu shares the bar */
    @media (min-width: 768px) {
      #header-subtitle { display: none; }
    }

    /* ---- Compact world clock + city picker ---- */
    .clock-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px; border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
      transition: border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
    }
    .clock-chip:hover { border-color: var(--border-strong); color: var(--text-strong); }
    .clock-chip .clock-city-label { color: var(--text-tertiary); font-weight: 500; }
    .clock-chip .clock-time { font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 500; color: var(--text-strong); font-variant-numeric: tabular-nums; }
    .clock-chip .clock-caret { opacity: .6; transition: transform var(--t-menu) var(--ease); }
    .clock-chip[aria-expanded="true"] .clock-caret { transform: rotate(180deg); }
    .clock-menu {
      position: absolute; top: calc(100% + 8px); right: 0;
      width: 250px; max-height: min(60vh, 420px); overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--overlay-shadow);
      padding: 8px;
      z-index: 80;
    }
    .clock-menu-title {
      display: flex; align-items: center; gap: 8px;
      padding: 8px;
      font-size: 12px; font-weight: 500;
      color: var(--text-tertiary);
    }
    .clock-menu-item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 8px; border-radius: var(--radius-sm);
      border: 0; background: transparent; cursor: pointer;
      font-size: 12px; color: var(--text-secondary); text-align: left;
    }
    .clock-menu-item:hover { background: var(--surface-2); color: var(--text-strong); }
    .clock-menu-item.is-active { background: var(--surface-2); color: var(--primary-strong); font-weight: 500; }
    .clock-menu-item .clock-menu-label {
      font-family: var(--font-mono, monospace); font-weight: 500; font-size: 12px;
      min-width: 34px;
    }
    .clock-menu-item .clock-menu-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Flat header — solid surface + one hairline rule (v34/v35) */
    #app-header {
      background: var(--surface);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-bottom: 1px solid var(--border);
      box-shadow: none;
    }
    /* Page transition base: one short fade (v35) */
    #app { transition: opacity var(--t-menu) var(--ease); }

    /*
     * Phones: make the iOS status-bar safe area part of the header surface,
     * then place the compact toolbar below the system icons. --header-h includes
     * that inset so sticky page controls line up with the real header edge.
     */
    @media (max-width: 767px) {
      :root { --header-h: calc(56px + env(safe-area-inset-top, 0px)); }
      #app-header {
        height: auto;
        padding-top: env(safe-area-inset-top, 0px);
        background: var(--app-chrome-color, #ffffff);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      #app-header .header-row {
        height: 56px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      #header-subtitle { margin-top: 1px; font-size: 12px; }
      #app { padding-top: 16px; }
    }

    /* v34: the decorative background wash/blobs are gone — flat design keeps
       the canvas quiet so content and controls carry the hierarchy. */
    /* Logo link */
    #logo-link { text-decoration: none; color: inherit; border-radius: var(--radius); }
    #logo-link:hover { transform: none; }
    #logo-link:active { transform: none; }
    .logo-badge { transition: background-color var(--t-fast) var(--ease); }
    #logo-link:hover .logo-badge { box-shadow: none; }
    /* “by TonSkywalker” — deliberately small next to the product name */
    .app-by {
      font-size: 12px; font-weight: 400;
      margin-left: 8px; white-space: nowrap; color: var(--text-tertiary);
    }
    /* The account name is useful on desktop; email is intentionally omitted so
       it cannot crowd the dashboard navigation. Long names truncate safely. */
    .user-display-name { flex: 0 1 auto; min-width: 0; max-width: clamp(56px, 9vw, 116px); }
    .user-display-name > span { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (min-width: 768px) {
      #app-header > div { min-width: 0; }
      #logo-link { flex: 0 1 auto; min-width: 0; }
      .header-controls-group { flex: 0 0 auto; min-width: 0; }
    }
    /* The profile picture opens the account menu (settings, theme, refresh). */
    #user-avatar-btn.has-settings { position: relative; }
  </style>
</head>
<body class="min-h-screen bg-[var(--bg)] text-[var(--text)]">
  <!-- Header -->
  <header id="app-header" class="sticky top-0 z-30">
    <div class="header-row max-w-[1280px] mx-auto px-4 flex items-center justify-between gap-3">
      <!-- Logo = home (trip list) -->
      <a href="#/trips" id="logo-link" class="flex items-center gap-3 group" title="หน้าแรก — รายการทริป" aria-label="Trip Manager — หน้าแรก">
        <span class="logo-badge w-10 h-10 grid place-items-center" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true">
            <circle cx="72" cy="28" r="15" fill="var(--brand-yellow-raw)"/>
            <path d="M4 82 L46 18 L88 82 Z" fill="rgba(255,255,255,0.96)"/>
            <path d="M34 36 L46 18 L58 36 L52 41 L46 34 L40 41 Z" fill="color-mix(in srgb, var(--primary-raw) 32%, transparent)"/>
            <path d="M34 36 L46 18 L58 36 L52 41 L46 34 L40 41 Z" fill="none" stroke="color-mix(in srgb, var(--primary-raw) 60%, transparent)" stroke-width="2.4"/>
            <rect x="4" y="84" width="92" height="6" rx="3" fill="var(--brand-yellow-raw)"/>
          </svg>
        </span>
        <span class="min-w-0">
          <span class="block leading-none tracking-tight" style="font-family: var(--font-display);">
            <span class="font-semibold text-[16px]">Trip&nbsp;Manager</span>
            <span class="app-by" title="จัดทำโดย TonSkywalker">by TonSkywalker</span>
          </span>
          <span id="header-subtitle" class="block text-xs text-[var(--text-tertiary)] mt-0.5">วางแผน · แบ่งจ่าย · เคลียร์บิล</span>
        </span>
      </a>

      <div class="flex items-center gap-3 header-controls-group">
        <!-- Theme, Lang, Mode controls injected by app.js -->
        <button id="refresh-btn" class="btn btn-ghost btn-icon btn-press" aria-label="Refresh"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
        <div id="user-menu" class="relative ml-1">
          <!-- v18: the profile picture is the single entry point for Settings -->
          <button id="user-avatar-btn" class="avatar w-10 h-10 text-[13px] btn-press has-settings" style="background: var(--primary); color: var(--on-primary);" title="บัญชีและการตั้งค่า" aria-label="บัญชีและการตั้งค่า">
            ?
          </button>
        </div>
      </div>
    </div>

    <!-- Desktop menu row (v29): every menu chip on its own line inside the
         sticky header, so nothing overlaps or hides on computers. Chips are
         rendered by renderDesktopNav() in app.js; phones keep the bottom nav.
         The world clock + sync pill sit at the right end of this row. -->
    <div class="header-nav-row max-w-[1280px] mx-auto px-4">
      <nav class="desktop-nav" id="desktop-nav" aria-label="เมนูหลัก"></nav>
      <!-- “เพิ่มเติม ▾” (v34 → v35): the secondary pages (เตรียมตัว / การจอง /
           ปฏิทิน / นำเข้า‑ส่งออก / ตั้งค่า). It sits at the end of the menu row —
           navigation lives in one place — and is filled by renderHeaderMoreMenu();
           hidden on phones, where the More page covers it. -->
      <div class="header-more" id="header-more"></div>
      <div class="header-nav-side">
        <div id="sync-status" class="hidden lg:flex items-center gap-2 text-xs px-2 py-1 text-[var(--text-tertiary)]">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span>ออนไลน์</span>
        </div>
        <!-- Compact world clock: tap to pick the city for the time -->
        <div id="clock-wrap" class="relative hidden lg:block">
          <button id="clock-chip" type="button" class="clock-chip" aria-haspopup="true" aria-expanded="false" title="เลือกเมืองสำหรับเวลา">
            <i data-lucide="globe-2" class="w-3 h-3"></i>
            <span id="clock-city-label" class="clock-city-label">BKK</span>
            <b id="clock-time" class="clock-time">--:--</b>
            <i data-lucide="chevron-down" class="w-3 h-3 clock-caret"></i>
          </button>
          <div id="clock-menu" class="clock-menu hidden" role="menu"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Member (username + PIN) session notice: shown when the Cloud Functions are
       not deployed, so data comes from Firestore/cache instead of a custom token. -->
  <div id="member-session-notice" hidden class="max-w-[1280px] mx-auto px-4 pt-3">
    <div class="flex items-start gap-2 text-[12px] rounded-xl px-3 py-2 border" style="background:var(--bg-secondary); border-color:var(--border); color:var(--text-secondary);">
      <i data-lucide="wifi-off" class="w-4 h-4 mt-0.5 shrink-0"></i>
      <span id="member-session-notice-text"></span>
      <button id="member-session-notice-close" class="ml-auto btn btn-ghost btn-icon shrink-0" aria-label="ปิด"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
    </div>
  </div>

  <!-- Offline (Firestore cache) indicator — v17 -->
  <div id="offline-strip-wrap" class="max-w-[1280px] mx-auto px-4 pt-3" hidden></div>

  <!-- Desktop Nav is inside the top bar now (see #app-header) — the row that
       used to sit here is gone so every page gets the space back. -->

  <!-- Main -->
  <main id="app" class="max-w-[1280px] mx-auto px-4 py-6 min-h-[calc(100vh_-_var(--header-h)_-_var(--bottom-nav-h))] md:min-h-[calc(100vh_-_var(--header-h)_-_60px)]">
    <div id="loading-screen" class="grid place-items-center py-24" role="status" aria-live="polite">
      <div class="app-loader">
        <span class="app-loader-spin" aria-hidden="true"></span>
        <p class="text-sm text-[var(--text-secondary)]">กำลังโหลด…</p>
      </div>
    </div>
  </main>

  <!-- Bottom Nav (mobile): Home removed — tap the logo to go home.
       Documents moved out (still reachable via the เพิ่มเติม page / desktop nav);
       Dashboard + เคลียร์บิล added for one-tap access. -->
  <nav id="bottom-nav" class="bottom-nav md:hidden">
    <button data-route="#/trip/dashboard" class="bottom-nav-item"><i data-lucide="layout-dashboard"></i><span>แดชบอร์ด</span></button>
    <button data-route="#/trip/itinerary" class="bottom-nav-item"><i data-lucide="map-pinned"></i><span>แผน</span></button>
    <button data-route="#/trip/expenses" class="bottom-nav-item"><i data-lucide="wallet"></i><span>ค่าใช้จ่าย</span></button>
    <button data-route="#/trip/settlement" class="bottom-nav-item"><i data-lucide="hand-coins"></i><span>เคลียร์บิล</span></button>
    <button data-route="#/trip/more" class="bottom-nav-item"><i data-lucide="more-horizontal"></i><span>เพิ่มเติม</span></button>
  </nav>

  <!-- Global footer (v35) — one quiet line: product, build, last update and the
       owner's copyright note. Values are painted from src/js/utils/buildInfo.js
       on boot (paintAppFooter). -->
  <footer id="app-footer" class="app-footer">
    <p class="app-footer-line">
      <span class="app-footer-wordmark">Trip Manager</span>
      <span class="app-footer-by">by TonSkywalker</span>
      <span class="app-footer-dot" aria-hidden="true">·</span>
      <span data-footer-version>v36</span>
      <span class="app-footer-dot" aria-hidden="true">·</span>
      <span data-footer-updated>อัปเดตล่าสุด 9 พ.ย. 2569</span>
      <span class="app-footer-dot app-footer-build-dot" aria-hidden="true">·</span>
      <span class="app-footer-build" data-build-stamp></span>
    </p>
    <p class="app-footer-legal">
      <!-- full © line, painted from buildInfo.js on boot / language change -->
      <span data-footer-copyright>© 2024–2026 TonSkywalker — สงวนลิขสิทธิ์</span>
    </p>
  </footer>

  <!-- FAB -->
  <!-- FAB: an extended, LABELLED action (v34). A bare “+” made people guess what
       it would add; the label is set per screen by renderFAB() in app.js. -->
  <button id="fab" class="fab hidden btn-press" aria-label="เพิ่มรายการ">
    <i data-lucide="plus" class="w-6 h-6"></i><span class="fab-label" id="fab-label"></span>
  </button>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Firebase config bootstrap -->
  <script>
    try {
      const saved = localStorage.getItem('fuji_firebase_config');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.apiKey && parsed.projectId) {
          window.__FIREBASE_CONFIG__ = parsed;
          console.log('[Config] Loaded from localStorage');
        }
      }
      const urlParams = new URLSearchParams(location.search);
      const cfgParam = urlParams.get('cfg');
      const isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (cfgParam && isLocalDev) {
        try {
          const decoded = JSON.parse(atob(cfgParam));
          if (decoded && typeof decoded.apiKey === 'string' && typeof decoded.projectId === 'string') {
            window.__FIREBASE_CONFIG__ = decoded;
            localStorage.setItem('fuji_firebase_config', JSON.stringify(decoded));
            console.log('[Config] Loaded from URL param (local dev)');
          }
        } catch (e) { console.warn('Invalid cfg param', e); }
      }
